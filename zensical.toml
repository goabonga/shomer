[project]
site_name        = "Shomer"
site_description = "OpenID Connect / OAuth 2.0 platform."
site_author      = "Chris <goabonga@pm.me>"
site_url         = "https://goabonga.github.io/shomer/"

repo_url  = "https://github.com/goabonga/shomer"
repo_name = "goabonga/shomer"
edit_uri  = "edit/main/docs/"

copyright = """
Shomer &middot; Copyright &copy; 2026 Chris &middot;
<a href="https://github.com/goabonga/shomer/blob/main/LICENSE">MIT License</a>
"""

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Dependency injection" = "injection.md" },
  { "Changelog" = "changelog.md" },
  { "Versions" = "versions.md" },
]

# Zensical falls back to its default extension set only when this table is
# absent — `config.get("markdown_extensions", DEFAULT_...)` is a fallback,
# not a merge. Declaring one extension therefore silently drops every
# default, superfences among them, and fenced code blocks come out as
# inline code. The defaults are restated here so `macros` can be added to
# them; keep them in step with Zensical's own DEFAULT_MARKDOWN_EXTENSIONS.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
"pymdownx.betterem" = {}
"pymdownx.caret" = {}
"pymdownx.details" = {}
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.tilde" = {}
"zensical.extensions.macros" = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

# `docs/changelog.md` is a one-line include of the repository's root
# CHANGELOG.md — the file multicz appends to on every release. Rendering
# the real file means the published page cannot fall behind it.
[project.markdown_extensions."pymdownx.snippets"]
base_path = ["."]
check_paths = true

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

# Per-component versions surfaced on docs/versions.md through the `macros`
# extension ({{ config.extra.versions.* }}). multicz rewrites each value on
# bump: every component lists the matching key in its `bump_files` (see
# multicz.toml), and the `docs` component `depends_on` them all so this
# page is regenerated whenever any version changes.
#
# NOTE: keys use underscores — a dash reads as subtraction inside the
# Jinja `{{ ... }}` macro expression.
[project.extra.versions]
api  = "0.0.0"
bdd  = "0.0.0"
cli  = "0.0.0"
job  = "0.0.0"
lib  = "0.0.0"
ssr  = "0.0.0"
web  = "0.0.0"
docs = "0.0.0"

[project.theme]
variant  = "classic"
logo     = "shomer.svg"
favicon  = "favicon.ico"
language = "en"

[[project.theme.palette]]
scheme  = "default"
primary = "deep purple"
accent  = "amber"
