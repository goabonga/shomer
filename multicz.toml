# multicz config: the shomer monorepo.
#
# Eight components. The graph is what matters — a release here is rarely
# one package:
#
#   lib   the shared library: contracts, settings, models, the database
#         connector and the DI module. Every service is wired from it, so
#         everything downstream cascades on a lib bump.
#
#   bdd   the Alembic revisions. Autogenerated against lib's model
#         metadata, shipped separately so a service that only needs the
#         models never installs Alembic.
#
#   api   the OIDC / OAuth 2.0 endpoints.
#   cli   the operator command line.
#   job   the maintenance worker.
#
#   web   the TypeScript sources of the frontend. Its post_bump runs the
#         esbuild build, which writes into packages/ssr/src/shomer_ssr/
#         {static,templates}/ — those files are picked up by hash diff and
#         join the release commit.
#
#   ssr   the Python package that serves them. It `depends_on` web AND
#         lib, so a frontend change or a contract change both produce a
#         wheel that actually contains them.
#
#   docs  the published site. It `depends_on` everything, because every
#         component writes its version into zensical.toml and the site
#         renders those numbers.

[project]
commit_convention = "conventional"
# One tag stream per component. A bare `v{version}` would collide the
# moment a second component ships.
tag_format        = "{component}-v{version}"
initial_version   = "0.0.0"
post_bump_policy  = "allow"   # opt in: enables the hooks declared below
# Aggregated cross-component CHANGELOG.md at the repo root, rendered by
# docs/changelog.md. Per-component files are still written; this one adds
# the bird's-eye view of what shipped together.
root_changelog    = "CHANGELOG.md"
# `[skip ci]` so the release commit does not start a second pipeline that
# would only rediscover that every component is freshly tagged and skip
# everything. It is matched anywhere in the message, so it stays off the
# subject line — which is what shows in `git log`, in the changelogs and
# in the release notes.
release_commit_message = "chore(release): bump {summary}\n\n{body}\n\n[skip ci]"

# ─────────────────────────────── lib ───────────────────────────────

# The root of the graph. It owns the contracts every other package types
# against, so a change here can alter what the services observe even when
# their own sources did not move — which is exactly what the cascades
# below are for.
[components.lib]
paths      = [
    "packages/lib/src/**",
    "packages/lib/pyproject.toml",
    "packages/lib/README.md",
]
bump_files = [
    { file = "packages/lib/pyproject.toml", key = "project.version" },
    { file = "packages/lib/src/shomer_lib/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^lib=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.lib" },
]
changelog  = "packages/lib/CHANGELOG.md"
post_bump  = ["uv lock"]

[[components.lib.artifacts]]
type = "pypi"
ref  = "shomer-lib=={version}"

# ─────────────────────────────── bdd ───────────────────────────────

[components.bdd]
paths      = [
    "packages/bdd/src/**",
    "packages/bdd/pyproject.toml",
    "packages/bdd/alembic.ini",
    "packages/bdd/README.md",
    "packages/bdd/Dockerfile",
]
bump_files = [
    { file = "packages/bdd/pyproject.toml", key = "project.version" },
    { file = "packages/bdd/src/shomer_bdd/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^bdd=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.bdd" },
]
changelog  = "packages/bdd/CHANGELOG.md"
# A model change in lib is a schema change waiting to be written, and the
# revision tree autogenerates against lib's metadata. Cascading here means
# the two are always released as a pair.
depends_on = ["lib"]
post_bump  = ["uv lock"]

# The chart deploys the image this component publishes, so its
# appVersion is not an independent value — it is this version, written
# here on every release. The write lands inside chart-bdd's own paths,
# which is what makes a new image release a new chart without either
# component naming the other.
mirrors    = [
    { file = "packages/bdd/chart/Chart.yaml", key = "appVersion" },
]

[[components.bdd.artifacts]]
type = "pypi"
ref  = "shomer-bdd=={version}"

[[components.bdd.artifacts]]
type = "docker"
ref  = "ghcr.io/goabonga/shomer-bdd:{version}"

# ─────────────────────────── chart-bdd ───────────────────────────

# Its own component because a chart changes for reasons the image does
# not: a probe, a resource limit, a network rule. Versioning them together
# would either republish an unchanged image or ship a chart change under a
# version that says nothing changed.
[components.chart-bdd]
paths      = ["packages/bdd/chart/**"]
bump_files = [
    { file = "packages/bdd/chart/Chart.yaml", key = "version" },
    { file = "VERSION", key = 'regex:^chart-bdd=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.chart_bdd" },
]
changelog  = "packages/bdd/chart/CHANGELOG.md"

[[components.chart-bdd.artifacts]]
type = "helm"
ref  = "oci://ghcr.io/goabonga/charts/shomer-bdd:{version}"

# ─────────────────────────────── api ───────────────────────────────

[components.api]
paths      = [
    "packages/api/src/**",
    "packages/api/pyproject.toml",
    "packages/api/README.md",
]
bump_files = [
    { file = "packages/api/pyproject.toml", key = "project.version" },
    { file = "packages/api/src/shomer_api/__init__.py", key = 'regex:^__version__\s*=\s*"([^"]+)"' },
    { file = "VERSION", key = 'regex:^api=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.api" },
]
changelog  = "packages/api/CHANGELOG.md"
depends_on = ["lib"]
post_bump  = ["uv lock"]

[[components.api.artifacts]]
type = "pypi"
ref  = "shomer-api=={version}"

# ─────────────────────────────── docs ───────────────────────────────

# The site is a component so that it is versioned and released like
# everything else rather than being redeployed silently.
#
# The bump_rules override adds `docs = "patch"`: a `docs:` commit bumps
# THIS component. It stays non-bumping for the code components, which are
# not re-released because their documentation changed.
[components.docs]
paths      = ["docs/**", "zensical.toml"]
bump_files = [
    { file = "VERSION", key = 'regex:^docs=(.+)$' },
    { file = "zensical.toml", key = "project.extra.versions.docs" },
]
# The library writes its version into zensical.toml, and the site prints
# it. Depending on it means the page is regenerated with the fresh number
# rather than staying a release behind.
depends_on = ["api", "bdd", "chart-bdd", "lib"]
bump_rules = { docs = "patch" }
