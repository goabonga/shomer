# uv workspace root. It is not a distributable itself — it exists to hold
# the members, the shared dev tooling and the lockfile every package
# resolves against.

[project]
name = "shomer-workspace"
version = "0.0.0"
description = "Shomer monorepo — uv workspace root."
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
shomer-lib = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
    "pre-commit>=4.0",
]
doc = [
    "zensical>=0.0.45",
]
favicon = [
    # scripts/generate_favicon.py — one-off branding asset tooling, kept
    # out of `dev` so a plain `uv sync` doesn't drag cairo in.
    "cairosvg>=2.7",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/lib/tests",
]
# importlib import mode, so two packages may both call their suite
# `test_app.py`. Under the default mode pytest derives a module name from
# the path relative to the rootdir and the second one collides.
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Without this the workspace's own packages sort as third-party, so an
# import block ends up ordered differently depending on whether the
# package happens to be installed.
known-first-party = [
    "shomer_lib",
]
