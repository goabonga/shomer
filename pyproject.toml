# uv workspace root. It is not a distributable itself — it exists to hold
# the members, the shared dev tooling and the lockfile every package
# resolves against.

[project]
name = "shomer-workspace"
version = "0.0.0"
description = "Shomer monorepo — uv workspace root."
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
shomer-bdd = { workspace = true }
shomer-lib = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.15",
    "pre-commit>=4.0",
]
doc = [
    "zensical>=0.0.45",
]
favicon = [
    # scripts/generate_favicon.py — one-off branding asset tooling, kept
    # out of `dev` so a plain `uv sync` doesn't drag cairo in.
    "cairosvg>=2.7",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/lib/tests",
]
# importlib import mode, so two packages may both call their suite
# `test_app.py`. Under the default mode pytest derives a module name from
# the path relative to the rootdir and the second one collides.
addopts = "-q --import-mode=importlib"

[tool.bandit]
# The static analyser runs over `packages/*/src` only. Tests and feature
# suites are full of the patterns it flags — asserts, hardcoded fixture
# credentials — and a scanner that cries about test fixtures is a scanner
# people learn to skip.
exclude_dirs = ["tests", "features"]
# B104 (binding 0.0.0.0) is asserted deliberately in the service
# entrypoints: a container or service manager reaches the process from
# outside its own namespace, and binding to localhost makes it
# unreachable everywhere except a developer's laptop. Each site carries
# its own `# noqa: S104` and the reasoning beside it.
skips = ["B104"]

[tool.mypy]
python_version = "3.13"
strict = true
# Every service names an interface and lets the container supply the
# implementation, so Protocol classes are passed as tokens constantly —
# to `bind` when wiring and to `resolve` when reading. mypy reports
# `type-abstract` for each one ("only concrete class can be given where
# type[T] is expected"), a rule about not instantiating an abstract type
# that simply does not apply when the class is a key rather than a
# constructor. It is a separate code from `abstract`, which still catches
# an actual `SomeProtocol()` call, so nothing real is lost.
disable_error_code = ["type-abstract"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Without this the workspace's own packages sort as third-party, so an
# import block ends up ordered differently depending on whether the
# package happens to be installed.
known-first-party = [
    "shomer_bdd",
    "shomer_lib",
]
