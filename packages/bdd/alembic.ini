# Alembic configuration for shomer-bdd.
#
# Run from the repository root:
#   uv run alembic -c packages/bdd/alembic.ini revision --autogenerate -m "..."
#   uv run alembic -c packages/bdd/alembic.ini upgrade head
#
# The database URL is deliberately NOT stored here. env.py resolves it, so
# a checkout carries no credentials and cannot be pointed at production by
# forgetting to edit a file. Override per-invocation with
# `alembic -x url=...`.

[alembic]
# %(here)s is the directory holding this file, so the paths resolve the
# same whether alembic is invoked from here or from the repository root.
script_location = %(here)s/src/shomer_bdd/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# sqlalchemy.url =   ; left blank on purpose — resolved in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
