[project]
name = "shomer-bdd"
version = "0.1.0"
description = "Shomer database migrations: the Alembic revision tree and its runner."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["shomer", "alembic", "migrations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]

dependencies = [
    "alembic>=1.14",
    "shomer-lib",
]


# Driver extras forward to shomer-lib so a migration run can connect to
# whatever the target actually is.
[project.optional-dependencies]
postgres = ["shomer-lib[postgres]"]
mysql = ["shomer-lib[mysql]"]

[project.urls]
Homepage = "https://github.com/goabonga/shomer"
Documentation = "https://goabonga.github.io/shomer/"
Source = "https://github.com/goabonga/shomer"
Issues = "https://github.com/goabonga/shomer/issues"

[project.scripts]
shomer-bdd = "shomer_bdd.migrate:main"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The revision tree (migrations/env.py, script.py.mako, versions/*) ships
# inside the wheel — `shomer-bdd upgrade` runs from the installed package,
# not from a checkout.
packages = ["src/shomer_bdd"]
