# CI + release pipeline. Per-component named jobs — no matrix, so every
# job is its own graph node, dependencies are explicit, and the Actions UI
# says at a glance which component broke.
#
# ─── Graph entry:
#
#   validate ── detect ── headers ──┬── one chain per python component
#                                   ├── web chain
#                                   └── docs-build
#
# ─── Per-component chains:
#
#   python (lib / bdd / api / cli / job / ssr):
#
#         X-lint ─────┐
#         X-format ───┼── X-test
#         X-typecheck ┘
#
#   web:  web-lint ─┬─ web-test ─ web-build ──> `web-dist` artifact
#         web-format┤
#         web-typecheck
##
# Change-gating is `if: contains(fromJson(needs.detect.outputs.changed).changed,
# '<name>')` on each chain's entry points. The skip then cascades through
# `needs:`, so an unchanged component produces no work. `detect` must sit
# in `needs:` directly — GitHub only exposes outputs for DIRECT needs, not
# transitive ones.
#
# ─── Release fan-out (main only, !chore(release), everything upstream green):
#
#   web-build  ─┐                  ┌─> release-web        (GitHub release)
#   *-test     ─┼─> release-bump ──┼─> release-<python>   (PyPI + release)
#   docs-build ─┘                  └─> release-docs       (Pages + release)
#
# release-bump runs `multicz bump --commit --tag --push` for every
# component that bumped — one atomic commit, N per-component tags. Each
# downstream job is gated on its own version being non-empty, so a
# component that did not bump publishes nothing.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded PR runs; QUEUE the ones on main, never kill them.
#
# The asymmetry is deliberate. A PR run only reports, so the newest is the
# only one worth having. A run on main publishes: release-bump tags and
# pushes, then the release jobs upload to PyPI, deploy Pages and cut
# GitHub releases. Cancelling between those leaves a tag with no artifact.
# Queuing costs wall-clock; cancelling costs correctness.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Anything that writes (push commits and tags, cut
# releases, publish to PyPI, deploy Pages) declares its own override.
permissions:
  contents: read

jobs:
  # ──────────────────── graph entry ────────────────────

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: goabonga/multicz-action@v1
      - name: multicz validate
        run: multicz validate --strict
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: '`multicz validate --strict` on the workspace config.'

  detect:
    # Gate on validate so a broken multicz.toml fails loudly upfront
    # rather than cryptically inside the `changed` action below.
    #
    # Two paths:
    #
    # 1. A `chore(release):` head commit is multicz's own release commit
    #    looping back through CI. Everything it would build was already
    #    published by the run that created it, so emit `changed=[]` and
    #    let the empty array cascade the skip across the whole graph.
    # 2. Anything else — compute the real per-component diff.
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      # `||` returns the first non-empty branch: the release-bypass output
      # wins on release commits, the multicz-action output otherwise.
      changed: ${{ steps.release-bypass.outputs.changed || steps.changed.outputs.json }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release-bypass
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        run: |
          set -euo pipefail
          {
            printf '## chore(release) — pipeline short-circuited\n\n'
            printf 'This run targets multicz'"'"'s own release commit '
            printf '(`%s`). Everything it would build was already ' "${GITHUB_SHA:0:7}"
            printf 'published by the `release-bump → release-<component>` '
            printf 'chain that created it.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'changed={"changed":[],"unchanged":[]}\n' >> "$GITHUB_OUTPUT"

      - id: changed
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        uses: goabonga/multicz-action/changed@v1
        with:
          output: json

      - name: Summary
        if: always() && !startsWith(github.event.head_commit.message, 'chore(release):')
        uses: ./.github/actions/summary
        with:
          title: detect
          body: 'Changed components: `${{ steps.changed.outputs.json }}`'

  headers:
    # Two gates: `needs: [detect]` so a broken config kills the run
    # upstream, and a non-empty `changed` so a commit that moved no
    # tracked component leaves nothing to re-validate. Actions expressions
    # have no `length()`, hence the round-trip through `toJSON()`.
    needs: [detect]
    if: toJSON(fromJson(needs.detect.outputs.changed).changed) != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - name: SPDX license headers
        run: |
          uv run --no-project python scripts/add_license_header.py --path packages --types py --check
          uv run --no-project python scripts/add_license_header.py --path scripts --types py,sh --check
          uv run --no-project python scripts/add_license_header.py --path .github --types yml --check
          uv run --no-project python scripts/add_license_header.py --path . --types toml --check
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: headers
          body: SPDX header check on `packages/`, `scripts/`, `.github/` and the root TOML.

  audit:
    # One workspace-level audit of the locked, non-dev closure — the
    # dependencies that actually ship. It fans into every container build,
    # so a known-vulnerable dependency stops an image from being built
    # rather than being found in it afterwards.
    #
    # Gated on something having changed at all: a `ci:` or docs-only
    # commit leaves the lockfile untouched, and re-auditing an identical
    # closure produces an identical answer.
    needs: [detect, headers]
    if: toJSON(fromJson(needs.detect.outputs.changed).changed) != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - name: Audit the resolved runtime closure
        run: |
          set -euo pipefail
          uv export --no-dev --no-emit-project --frozen \
            --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: audit
          body: '`pip-audit` on the resolved non-dev closure (`uv export --no-dev`).'

  # ──────────────────── lib ────────────────────

  lib-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'lib')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/lib, module: shomer_lib, check: lint }

  lib-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'lib')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/lib, module: shomer_lib, check: format }

  lib-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'lib')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/lib, module: shomer_lib, check: typecheck }

  lib-test:
    needs: [lib-lint, lib-format, lib-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/lib, module: shomer_lib, check: test }

  lib-bandit:
    # Static analysis on the source that ships. It gates the container
    # build rather than running beside it: an image is expensive to build
    # and worthless to scan if the code in it is already known-bad.
    needs: [lib-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -q -r packages/lib/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lib-bandit
          body: '`bandit` static analysis on `packages/lib/src`.'

  # ──────────────────── bdd ────────────────────

  bdd-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/bdd, module: shomer_bdd, check: lint }

  bdd-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/bdd, module: shomer_bdd, check: format }

  bdd-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/bdd, module: shomer_bdd, check: typecheck }

  bdd-test:
    needs: [bdd-lint, bdd-format, bdd-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/bdd, module: shomer_bdd, check: test }

  bdd-bandit:
    # Static analysis on the source that ships. It gates the container
    # build rather than running beside it: an image is expensive to build
    # and worthless to scan if the code in it is already known-bad.
    needs: [bdd-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -q -r packages/bdd/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-bandit
          body: '`bandit` static analysis on `packages/bdd/src`.'

  bdd-hadolint:
    # Dockerfile lint, parallel to the Python checks. It gates the build
    # so a malformed Dockerfile fails in seconds rather than after a
    # multi-minute image pull.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/bdd/Dockerfile
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-hadolint
          body: '`hadolint` on `packages/bdd/Dockerfile`.'

  bdd-container:
    # The explicit gate replaces GitHub's implicit "every transitive need
    # succeeded". `audit` is shared by every component, so on a
    # partial-change run it carries other packages' skipped jobs in its
    # closure — and that skip would silently mark this job skipped even
    # though its own dependencies all passed, leaving the release path
    # for this component quietly dead.
    needs: [bdd-bandit, bdd-hadolint, audit, detect]
    if: >-
      !failure() && !cancelled() &&
      contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@v4
      # The three annotation values that cannot be static. The rest are
      # LABELs in the Dockerfile, so a local build carries them too.
      # bump-preview has already written the version this build will be
      # released as.
      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(sed -n 's/^bdd=//p' VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build bdd
        uses: docker/build-push-action@v7
        with:
          # The context is `packages`, not the component directory: every
          # service depends on shomer-lib, which is not on PyPI.
          context: packages
          file: packages/bdd/Dockerfile
          load: true
          # `provenance` / `sbom` cannot be combined with `load: true` —
          # a manifest list does not go through the docker exporter.
          # Both are attached at push time by publish-image instead.
          tags: bdd:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=bdd
          # ignore-error: the cache export can fail to reserve its key on
          # a run whose image built fine. A cache miss must not fail a
          # green build.
          cache-to: type=gha,mode=max,scope=bdd,ignore-error=true
      - name: Assert the OCI annotations landed
        run: |
          set -euo pipefail
          for k in title version revision created source licenses; do
            v=$(docker image inspect bdd:ci \
                  --format "{{ index .Config.Labels \"org.opencontainers.image.$k\" }}")
            [ -n "$v" ] || { echo "::error::org.opencontainers.image.$k is empty"; exit 1; }
            printf '  %-10s %s\n' "$k" "$v"
          done
      - name: Assert it does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect bdd:ci --format '{{.Config.User}}')
          [ "$user" = "65532" ] || { echo "::error::image runs as '$user', want 65532"; exit 1; }
      - name: Save the image
        run: docker save bdd:ci -o /tmp/bdd.tar
      - uses: actions/upload-artifact@v7
        with: { name: bdd-image, path: /tmp/bdd.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-container
          body: 'Built `bdd:ci` from `packages/bdd/Dockerfile` (artifact `bdd-image`).'

  bdd-sbom:
    needs: [bdd-container]
    if: '!failure() && !cancelled() && needs.bdd-container.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: bdd-image, path: /tmp }
      - uses: anchore/sbom-action@v0
        with:
          image: docker-archive:/tmp/bdd.tar
          format: spdx-json
          output-file: /tmp/bdd.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v7
        with: { name: bdd-sbom, path: /tmp/bdd.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-sbom
          body: 'SPDX SBOM of the `bdd` image (artifact `bdd-sbom`).'
          format: sbom
          path: /tmp/bdd.sbom.spdx.json

  bdd-grype:
    needs: [bdd-sbom]
    if: '!failure() && !cancelled() && needs.bdd-sbom.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: bdd-sbom, path: /tmp }
      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Scan the SBOM
        # The working directory is what makes grype pick up
        # `packages/bdd/.grype.yaml`, so an exception is declared beside
        # the component it applies to rather than in one global list.
        working-directory: packages/bdd
        run: |
          set -euo pipefail
          # The report is written from the same scan the gate then runs,
          # in this order on purpose: the gate may fail the step, and the
          # summary still needs its input.
          grype sbom:/tmp/bdd.sbom.spdx.json -o json > /tmp/bdd.grype.json
          grype sbom:/tmp/bdd.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-grype
          body: '`grype --fail-on high` on the `bdd` SBOM, with `packages/bdd/.grype.yaml` applied.'
          format: grype
          path: /tmp/bdd.grype.json

  docs-build:
    # Build the site on every docs change (PR and main). On main,
    # release-docs reuses this artifact instead of rebuilding —
    # bump-preview already wrote the next version into the working tree,
    # so the bytes are identical to what a rebuild would produce.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - name: Install the doc group
        run: uv sync --frozen --only-group doc
      - name: Zensical build
        run: uv run --no-sync zensical build --clean
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs-build
          body: '`zensical build` → uploaded as `docs-site` for `release-docs` to consume.'

  # ──────────────────── release ────────────────────

  release-bump:
    # The single stage the whole graph funnels into. multicz discovers
    # which components changed since their last tag, then commits, tags
    # and pushes ALL of them in one atomic commit. Downstream publish jobs
    # read the resulting versions to decide whether to run.
    #
    # Triple gate:
    #   1. `main` only — PRs and other branches skip.
    #   2. The head commit must not itself be a release bump, or the
    #      release commit re-triggers CI and we loop.
    #   3. Every upstream check passed or was skipped. Any failure aborts.
    needs:
      - validate
      - detect
      - headers
      - audit
      - lib-bandit
      - bdd-grype
      - docs-build
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'lib') ||
       needs.lib-bandit.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'bdd') ||
       needs.bdd-grype.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'docs') ||
       needs.docs-build.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: push-to-main
      cancel-in-progress: false
    permissions:
      contents: write   # push the release commit + tags
    outputs:
      # The whole bump map, as JSON. A release job reads its own entry
      # out of it, so adding a component is one new job rather than an
      # edit here, in the extraction step and in the job — three places,
      # where forgetting the first two ships a component that bumped,
      # tagged and was never published.
      # `|| '{}'` matters: the extraction step is skipped when nothing is
      # pending, and every downstream `if` calls fromJson on this. Left
      # empty, fromJson('') raises and turns a quiet no-release run into a
      # wall of failed publish jobs.
      bumps: ${{ steps.bump.outputs.bumps || '{}' }}
      # ghcr namespaces are lowercase; the repository owner is not
      # necessarily. Computed once here rather than in each publish job.
      owner: ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # Pinned, like every other setup-uv in this pipeline. An unpinned one
      # does not fall back to something sane — it honours whatever
      # UV_PYTHON an earlier step left in the environment, and a composite
      # action setting 3.12 is enough to make `uv sync` refuse a workspace
      # whose floor is 3.13.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"

      - name: Install the workspace (ssr's post_bump runs `uv lock`)
        run: uv sync --all-packages

      # web's post_bump rebuilds the bundle during the bump, so Node has
      # to be present before multicz runs — not after.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      # It runs its own setup-uv, which re-exports UV_PYTHON as 3.12 and
      # undoes the pin above. The steps below that reach uv therefore set
      # it again at step level, which nothing later can overwrite.
      - uses: goabonga/multicz-action@v1

      - name: Configure git
        # Author name and email come from the head commit's metadata,
        # which anyone who can land a commit controls. Passing them
        # through `env:` makes them plain shell variables under quoted
        # expansion instead of text spliced into the script.
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock the GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: multicz plan
        id: plan
        env:
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          multicz plan --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/plan.json
          # multicz emits more than one JSON document here (the plan, then
          # a trailing advice object), so slurp and merge before asking
          # whether anything is pending.
          COUNT=$(jq -s '[.[] | .bumps // {}] | add | length' /tmp/plan.json)
          if [ "$COUNT" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag, push (signed)
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available == 'true'
        env:
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          multicz bump --commit --tag --push --sign \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.raw
          # post_bump hooks print progress on stdout BEFORE the final JSON
          # object, so the raw output is not parseable. Strip everything
          # up to the document's opening brace, then validate — silently
          # empty versions would skip every publish job below.
          sed -n '/^{$/,$p' /tmp/release.raw > /tmp/release.json
          jq . /tmp/release.json > /dev/null

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available != 'true'
        env:
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          multicz bump --commit --tag --push \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.raw
          sed -n '/^{$/,$p' /tmp/release.raw > /tmp/release.json
          jq . /tmp/release.json > /dev/null

      - name: Extract the bumped versions
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          # Logged so the downstream skip/run decision is auditable from
          # the run page alone.
          jq -r '.bumps | to_entries[] | "[release-bump] \(.key)=\(.value.next_version)"' \
            /tmp/release.json
          # Compact so it survives GITHUB_OUTPUT's one-line-per-value rule.
          echo "bumps=$(jq -c '.bumps // {}' /tmp/release.json)" >> "$GITHUB_OUTPUT"

      - name: Lowercase ghcr namespace
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-bump
          body: |
            `multicz bump --commit --tag --push` (signed when
            `GPG_PRIVATE_KEY` and `GPG_PASSPHRASE` are set). The
            `release-<component>` jobs read this job's outputs to know
            what to publish.

  release-lib-pypi:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['lib'].next_version != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shomer-lib/
    permissions:
      contents: write   # gh release create
      id-token: write   # Trusted Publishing (OIDC) — do NOT add a token
    steps:
      - uses: actions/checkout@v6
        with:
          # The release commit, so the wheel carries the version that was
          # just tagged rather than the one that preceded it.
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-pypi
        with:
          package: shomer-lib
          tag: lib-v${{ fromJson(needs.release-bump.outputs.bumps)['lib'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  release-docs:
    # Consume the `docs-site` artifact built earlier in this run with the
    # same bump-previewed version release-bump then committed — no
    # rebuild. Deploy to Pages, then cut the docs tag's release.
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['docs'].next_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      pages: write      # actions/deploy-pages
      id-token: write   # OIDC for upload-pages-artifact + deploy-pages
    concurrency:
      group: pages      # one in-flight Pages deploy per repository
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      # No configure-pages step. Its `enablement` input asks the API to
      # create the Pages site, which the workflow token may not do — it
      # fails with "Resource not accessible by integration". Pages is
      # turned on once in the repository settings, with GitHub Actions as
      # the source; the two steps below need nothing more.
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - uses: ./.github/actions/publish-release
        with:
          tag: docs-v${{ fromJson(needs.release-bump.outputs.bumps)['docs'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
