# CI + release pipeline. Per-component named jobs — no matrix, so every
# job is its own graph node, dependencies are explicit, and the Actions UI
# says at a glance which component broke.
#
# ─── Graph entry:
#
#   validate ── detect ── headers ──┬── one chain per python component
#                                   ├── web chain
#                                   └── docs-build
#
# ─── Per-component chains:
#
#   python (lib / bdd / api / cli / job / ssr):
#
#         X-lint ─────┐
#         X-format ───┼── X-test
#         X-typecheck ┘
#
#   web:  web-lint ─┬─ web-test ─ web-build ──> `web-dist` artifact
#         web-format┤
#         web-typecheck
##
# Change-gating is `if: contains(fromJson(needs.detect.outputs.changed).changed,
# '<name>')` on each chain's entry points. The skip then cascades through
# `needs:`, so an unchanged component produces no work. `detect` must sit
# in `needs:` directly — GitHub only exposes outputs for DIRECT needs, not
# transitive ones.
#
# ─── Release fan-out (main only, !chore(release), everything upstream green):
#
#   web-build  ─┐                  ┌─> release-web        (GitHub release)
#   *-test     ─┼─> release-bump ──┼─> release-<python>   (PyPI + release)
#   docs-build ─┘                  └─> release-docs       (Pages + release)
#
# release-bump runs `multicz bump --commit --tag --push` for every
# component that bumped — one atomic commit, N per-component tags. Each
# downstream job is gated on its own version being non-empty, so a
# component that did not bump publishes nothing.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded PR runs; QUEUE the ones on main, never kill them.
#
# The asymmetry is deliberate. A PR run only reports, so the newest is the
# only one worth having. A run on main publishes: release-bump tags and
# pushes, then the release jobs upload to PyPI, deploy Pages and cut
# GitHub releases. Cancelling between those leaves a tag with no artifact.
# Queuing costs wall-clock; cancelling costs correctness.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. Anything that writes (push commits and tags, cut
# releases, publish to PyPI, deploy Pages) declares its own override.
permissions:
  contents: read

jobs:
  # ──────────────────── graph entry ────────────────────

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: goabonga/multicz-action@v1
      - name: multicz validate
        run: multicz validate --strict
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: validate
          body: '`multicz validate --strict` on the workspace config.'

  detect:
    # Gate on validate so a broken multicz.toml fails loudly upfront
    # rather than cryptically inside the `changed` action below.
    #
    # Two paths:
    #
    # 1. A `chore(release):` head commit is multicz's own release commit
    #    looping back through CI. Everything it would build was already
    #    published by the run that created it, so emit `changed=[]` and
    #    let the empty array cascade the skip across the whole graph.
    # 2. Anything else — compute the real per-component diff.
    needs: [validate]
    runs-on: ubuntu-latest
    outputs:
      # `||` returns the first non-empty branch: the release-bypass output
      # wins on release commits, the multicz-action output otherwise.
      changed: ${{ steps.release-bypass.outputs.changed || steps.changed.outputs.json }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release-bypass
        if: startsWith(github.event.head_commit.message, 'chore(release):')
        run: |
          set -euo pipefail
          {
            printf '## chore(release) — pipeline short-circuited\n\n'
            printf 'This run targets multicz'"'"'s own release commit '
            printf '(`%s`). Everything it would build was already ' "${GITHUB_SHA:0:7}"
            printf 'published by the `release-bump → release-<component>` '
            printf 'chain that created it.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'changed={"changed":[],"unchanged":[]}\n' >> "$GITHUB_OUTPUT"

      - id: changed
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        uses: goabonga/multicz-action/changed@v1
        with:
          output: json

      - name: Summary
        if: always() && !startsWith(github.event.head_commit.message, 'chore(release):')
        uses: ./.github/actions/summary
        with:
          title: detect
          body: 'Changed components: `${{ steps.changed.outputs.json }}`'

  headers:
    # Two gates: `needs: [detect]` so a broken config kills the run
    # upstream, and a non-empty `changed` so a commit that moved no
    # tracked component leaves nothing to re-validate. Actions expressions
    # have no `length()`, hence the round-trip through `toJSON()`.
    needs: [detect]
    if: toJSON(fromJson(needs.detect.outputs.changed).changed) != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - name: SPDX license headers
        run: |
          uv run --no-project python scripts/add_license_header.py --path packages --types py --check
          uv run --no-project python scripts/add_license_header.py --path scripts --types py,sh --check
          uv run --no-project python scripts/add_license_header.py --path .github --types yml --check
          uv run --no-project python scripts/add_license_header.py --path . --types toml --check
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: headers
          body: SPDX header check on `packages/`, `scripts/`, `.github/` and the root TOML.

  audit:
    # One workspace-level audit of the locked, non-dev closure — the
    # dependencies that actually ship. It fans into every container build,
    # so a known-vulnerable dependency stops an image from being built
    # rather than being found in it afterwards.
    #
    # Gated on something having changed at all: a `ci:` or docs-only
    # commit leaves the lockfile untouched, and re-auditing an identical
    # closure produces an identical answer.
    needs: [detect, headers]
    if: toJSON(fromJson(needs.detect.outputs.changed).changed) != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - name: Audit the resolved runtime closure
        run: |
          set -euo pipefail
          uv export --no-dev --no-emit-project --frozen \
            --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: audit
          body: '`pip-audit` on the resolved non-dev closure (`uv export --no-dev`).'

  # ──────────────────── lib ────────────────────

  lib-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'lib')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/lib, module: shomer_lib, check: lint }

  lib-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'lib')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/lib, module: shomer_lib, check: format }

  lib-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'lib')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/lib, module: shomer_lib, check: typecheck }

  lib-test:
    needs: [lib-lint, lib-format, lib-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/lib, module: shomer_lib, check: test }

  lib-bandit:
    # Static analysis on the source that ships. It gates the container
    # build rather than running beside it: an image is expensive to build
    # and worthless to scan if the code in it is already known-bad.
    needs: [lib-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -q -r packages/lib/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: lib-bandit
          body: '`bandit` static analysis on `packages/lib/src`.'

  # ──────────────────── bdd ────────────────────

  bdd-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/bdd, module: shomer_bdd, check: lint }

  bdd-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/bdd, module: shomer_bdd, check: format }

  bdd-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/bdd, module: shomer_bdd, check: typecheck }

  bdd-test:
    needs: [bdd-lint, bdd-format, bdd-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/bdd, module: shomer_bdd, check: test }

  bdd-bandit:
    # Static analysis on the source that ships. It gates the container
    # build rather than running beside it: an image is expensive to build
    # and worthless to scan if the code in it is already known-bad.
    needs: [bdd-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -q -r packages/bdd/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-bandit
          body: '`bandit` static analysis on `packages/bdd/src`.'

  bdd-hadolint:
    # Dockerfile lint, parallel to the Python checks. It gates the build
    # so a malformed Dockerfile fails in seconds rather than after a
    # multi-minute image pull.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/bdd/Dockerfile
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-hadolint
          body: '`hadolint` on `packages/bdd/Dockerfile`.'

  bdd-container:
    # The explicit gate replaces GitHub's implicit "every transitive need
    # succeeded". `audit` is shared by every component, so on a
    # partial-change run it carries other packages' skipped jobs in its
    # closure — and that skip would silently mark this job skipped even
    # though its own dependencies all passed, leaving the release path
    # for this component quietly dead.
    needs: [bdd-bandit, bdd-hadolint, audit, detect]
    if: >-
      !failure() && !cancelled() &&
      contains(fromJson(needs.detect.outputs.changed).changed, 'bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@v4
      # The three annotation values that cannot be static. The rest are
      # LABELs in the Dockerfile, so a local build carries them too.
      # bump-preview has already written the version this build will be
      # released as.
      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(sed -n 's/^bdd=//p' VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build bdd
        uses: docker/build-push-action@v7
        with:
          # The context is `packages`, not the component directory: every
          # service depends on shomer-lib, which is not on PyPI.
          context: packages
          file: packages/bdd/Dockerfile
          load: true
          # `provenance` / `sbom` cannot be combined with `load: true` —
          # a manifest list does not go through the docker exporter.
          # Both are attached at push time by publish-image instead.
          tags: bdd:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=bdd
          # ignore-error: the cache export can fail to reserve its key on
          # a run whose image built fine. A cache miss must not fail a
          # green build.
          cache-to: type=gha,mode=max,scope=bdd,ignore-error=true
      - name: Assert the OCI annotations landed
        run: |
          set -euo pipefail
          for k in title version revision created source licenses; do
            v=$(docker image inspect bdd:ci \
                  --format "{{ index .Config.Labels \"org.opencontainers.image.$k\" }}")
            [ -n "$v" ] || { echo "::error::org.opencontainers.image.$k is empty"; exit 1; }
            printf '  %-10s %s\n' "$k" "$v"
          done
      - name: Assert it does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect bdd:ci --format '{{.Config.User}}')
          [ "$user" = "65532" ] || { echo "::error::image runs as '$user', want 65532"; exit 1; }
      - name: Save the image
        run: docker save bdd:ci -o /tmp/bdd.tar
      - uses: actions/upload-artifact@v7
        with: { name: bdd-image, path: /tmp/bdd.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-container
          body: 'Built `bdd:ci` from `packages/bdd/Dockerfile` (artifact `bdd-image`).'

  bdd-sbom:
    needs: [bdd-container]
    if: '!failure() && !cancelled() && needs.bdd-container.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: bdd-image, path: /tmp }
      - uses: anchore/sbom-action@v0
        with:
          image: docker-archive:/tmp/bdd.tar
          format: spdx-json
          output-file: /tmp/bdd.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v7
        with: { name: bdd-sbom, path: /tmp/bdd.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-sbom
          body: 'SPDX SBOM of the `bdd` image (artifact `bdd-sbom`).'
          format: sbom
          path: /tmp/bdd.sbom.spdx.json

  bdd-grype:
    needs: [bdd-sbom]
    if: '!failure() && !cancelled() && needs.bdd-sbom.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: bdd-sbom, path: /tmp }
      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Scan the SBOM
        # The working directory is what makes grype pick up
        # `packages/bdd/.grype.yaml`, so an exception is declared beside
        # the component it applies to rather than in one global list.
        working-directory: packages/bdd
        run: |
          set -euo pipefail
          # The report is written from the same scan the gate then runs,
          # in this order on purpose: the gate may fail the step, and the
          # summary still needs its input.
          grype sbom:/tmp/bdd.sbom.spdx.json -o json > /tmp/bdd.grype.json
          grype sbom:/tmp/bdd.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: bdd-grype
          body: '`grype --fail-on high` on the `bdd` SBOM, with `packages/bdd/.grype.yaml` applied.'
          format: grype
          path: /tmp/bdd.grype.json

  chart-bdd-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'chart-bdd')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - run: helm lint packages/bdd/chart --set settings.existingSecret=shomer-db
      # Render every branch, not just the default one. A template only the
      # non-default path reaches is a template nothing checks until the
      # day somebody switches CNI or turns verification on.
      - name: Render each network provider and the verification policy
        run: |
          set -euo pipefail
          for provider in kubernetes calico cilium; do
            helm template ci packages/bdd/chart --set settings.existingSecret=shomer-db \
              --set networkPolicy.provider="$provider" \
              > "/tmp/chart-bdd-$provider.yaml"
          done
          helm template ci packages/bdd/chart --set settings.existingSecret=shomer-db \
            --set imageVerification.enabled=true \
            > /tmp/chart-bdd-verify.yaml
          # An unknown provider must fail loudly rather than render an
          # empty policy and leave the pod wide open.
          if helm template ci packages/bdd/chart --set settings.existingSecret=shomer-db \
               --set networkPolicy.provider=bogus > /dev/null 2>&1; then
            echo "::error::an unknown networkPolicy.provider rendered without failing"
            exit 1
          fi
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-bdd-lint
          body: '`helm lint` + `helm template` on `packages/bdd/chart/`.'

  chart-bdd-checkov:
    needs: [chart-bdd-lint]
    if: '!failure() && !cancelled() && needs.chart-bdd-lint.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: packages/bdd/chart
          framework: helm
          quiet: true
          output_format: cli
          soft_fail: false
          # CKV_K8S_21: the namespace is a deploy-time flag, not a chart
          # decision. CKV_K8S_43: digest pinning is incompatible with the
          # version-tag scheme, and provenance is established by the
          # cosign signature and SBOM attestation instead.
          skip_check: CKV_K8S_21,CKV_K8S_43
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-bdd-checkov
          body: '`checkov --framework helm` on `packages/bdd/chart/`.'

  chart-bdd-verify-policy:
    # The chart renders an image-verification policy; this proves the
    # policy is not inert. Kyverno in a throwaway cluster, Enforce on, and
    # an image the policy matches but whose signature carries someone
    # else's identity must be rejected — then admitted once the policy is
    # removed, so the rejection cannot have come from something else.
    needs: [chart-bdd-checkov]
    if: '!failure() && !cancelled() && needs.chart-bdd-checkov.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/chart-verify-policy
        with:
          chart: packages/bdd/chart
          component: bdd
          extra-set: --set settings.existingSecret=shomer-db
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-bdd-verify-policy
          body: 'kind + Kyverno: the `imageVerification` policy rejects a foreign-signed image, and admits it once removed.'

  chart-bdd-package:
    needs: [chart-bdd-checkov]
    if: '!failure() && !cancelled() && needs.chart-bdd-checkov.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      # Packaged here with the bumped version already written in, so the
      # release job only has to push what this run linted.
      - run: |
          mkdir -p /tmp/chart-bdd
          helm package packages/bdd/chart --destination /tmp/chart-bdd
      - uses: actions/upload-artifact@v7
        with: { name: chart-bdd-tgz, path: /tmp/chart-bdd/, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-bdd-package
          body: '`helm package` at the bump-previewed version (artifact `chart-bdd-tgz`).'

  # ──────────────────── api ────────────────────

  api-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/api, module: shomer_api, check: lint }

  api-format:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/api, module: shomer_api, check: format }

  api-typecheck:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/api, module: shomer_api, check: typecheck }

  api-test:
    needs: [api-lint, api-format, api-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/python-check
        with: { path: packages/api, module: shomer_api, check: test }

  api-bandit:
    # Static analysis on the source that ships. It gates the container
    # build rather than running beside it: an image is expensive to build
    # and worthless to scan if the code in it is already known-bad.
    needs: [api-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -q -r packages/api/src
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-bandit
          body: '`bandit` static analysis on `packages/api/src`.'

  api-hadolint:
    # Dockerfile lint, parallel to the Python checks. It gates the build
    # so a malformed Dockerfile fails in seconds rather than after a
    # multi-minute image pull.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: packages/api/Dockerfile
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-hadolint
          body: '`hadolint` on `packages/api/Dockerfile`.'

  api-container:
    # The explicit gate replaces GitHub's implicit "every transitive need
    # succeeded". `audit` is shared by every component, so on a
    # partial-change run it carries other packages' skipped jobs in its
    # closure — and that skip would silently mark this job skipped even
    # though its own dependencies all passed, leaving the release path
    # for this component quietly dead.
    needs: [api-bandit, api-hadolint, audit, detect]
    if: >-
      !failure() && !cancelled() &&
      contains(fromJson(needs.detect.outputs.changed).changed, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: docker/setup-buildx-action@v4
      # The three annotation values that cannot be static. The rest are
      # LABELs in the Dockerfile, so a local build carries them too.
      # bump-preview has already written the version this build will be
      # released as.
      - name: Image metadata
        id: meta
        run: |
          set -euo pipefail
          echo "version=$(sed -n 's/^api=//p' VERSION)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build api
        uses: docker/build-push-action@v7
        with:
          # The context is `packages`, not the component directory: every
          # service depends on shomer-lib, which is not on PyPI.
          context: packages
          file: packages/api/Dockerfile
          load: true
          # `provenance` / `sbom` cannot be combined with `load: true` —
          # a manifest list does not go through the docker exporter.
          # Both are attached at push time by publish-image instead.
          tags: api:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=api
          # ignore-error: the cache export can fail to reserve its key on
          # a run whose image built fine. A cache miss must not fail a
          # green build.
          cache-to: type=gha,mode=max,scope=api,ignore-error=true
      - name: Assert the OCI annotations landed
        run: |
          set -euo pipefail
          for k in title version revision created source licenses; do
            v=$(docker image inspect api:ci \
                  --format "{{ index .Config.Labels \"org.opencontainers.image.$k\" }}")
            [ -n "$v" ] || { echo "::error::org.opencontainers.image.$k is empty"; exit 1; }
            printf '  %-10s %s\n' "$k" "$v"
          done
      - name: Assert it does not run as root
        run: |
          set -euo pipefail
          user=$(docker image inspect api:ci --format '{{.Config.User}}')
          [ "$user" = "65532" ] || { echo "::error::image runs as '$user', want 65532"; exit 1; }
      - name: Save the image
        run: docker save api:ci -o /tmp/api.tar
      - uses: actions/upload-artifact@v7
        with: { name: api-image, path: /tmp/api.tar, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-container
          body: 'Built `api:ci` from `packages/api/Dockerfile` (artifact `api-image`).'

  api-sbom:
    needs: [api-container]
    if: '!failure() && !cancelled() && needs.api-container.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: api-image, path: /tmp }
      - uses: anchore/sbom-action@v0
        with:
          image: docker-archive:/tmp/api.tar
          format: spdx-json
          output-file: /tmp/api.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v7
        with: { name: api-sbom, path: /tmp/api.sbom.spdx.json, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-sbom
          body: 'SPDX SBOM of the `api` image (artifact `api-sbom`).'
          format: sbom
          path: /tmp/api.sbom.spdx.json

  api-grype:
    needs: [api-sbom]
    if: '!failure() && !cancelled() && needs.api-sbom.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: api-sbom, path: /tmp }
      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Scan the SBOM
        # The working directory is what makes grype pick up
        # `packages/api/.grype.yaml`, so an exception is declared beside
        # the component it applies to rather than in one global list.
        working-directory: packages/api
        run: |
          set -euo pipefail
          # The report is written from the same scan the gate then runs,
          # in this order on purpose: the gate may fail the step, and the
          # summary still needs its input.
          grype sbom:/tmp/api.sbom.spdx.json -o json > /tmp/api.grype.json
          grype sbom:/tmp/api.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: api-grype
          body: '`grype --fail-on high` on the `api` SBOM, with `packages/api/.grype.yaml` applied.'
          format: grype
          path: /tmp/api.grype.json

  chart-api-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - run: helm lint packages/api/chart
      # Render every branch, not just the default one. A template only the
      # non-default path reaches is a template nothing checks until the
      # day somebody switches CNI or turns verification on.
      - name: Render each network provider and the verification policy
        run: |
          set -euo pipefail
          for provider in kubernetes calico cilium; do
            helm template ci packages/api/chart \
              --set networkPolicy.provider="$provider" \
              > "/tmp/chart-api-$provider.yaml"
          done
          helm template ci packages/api/chart \
            --set imageVerification.enabled=true \
            > /tmp/chart-api-verify.yaml
          # An unknown provider must fail loudly rather than render an
          # empty policy and leave the pod wide open.
          if helm template ci packages/api/chart \
               --set networkPolicy.provider=bogus > /dev/null 2>&1; then
            echo "::error::an unknown networkPolicy.provider rendered without failing"
            exit 1
          fi
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-api-lint
          body: '`helm lint` + `helm template` on `packages/api/chart/`.'

  chart-api-checkov:
    needs: [chart-api-lint]
    if: '!failure() && !cancelled() && needs.chart-api-lint.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: packages/api/chart
          framework: helm
          quiet: true
          output_format: cli
          soft_fail: false
          # CKV_K8S_21: the namespace is a deploy-time flag, not a chart
          # decision. CKV_K8S_43: digest pinning is incompatible with the
          # version-tag scheme, and provenance is established by the
          # cosign signature and SBOM attestation instead.
          skip_check: CKV_K8S_21,CKV_K8S_43
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-api-checkov
          body: '`checkov --framework helm` on `packages/api/chart/`.'

  chart-api-verify-policy:
    # The chart renders an image-verification policy; this proves the
    # policy is not inert. Kyverno in a throwaway cluster, Enforce on, and
    # an image the policy matches but whose signature carries someone
    # else's identity must be rejected — then admitted once the policy is
    # removed, so the rejection cannot have come from something else.
    needs: [chart-api-checkov]
    if: '!failure() && !cancelled() && needs.chart-api-checkov.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/chart-verify-policy
        with:
          chart: packages/api/chart
          component: api
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-api-verify-policy
          body: 'kind + Kyverno: the `imageVerification` policy rejects a foreign-signed image, and admits it once removed.'

  chart-api-package:
    needs: [chart-api-checkov]
    if: '!failure() && !cancelled() && needs.chart-api-checkov.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      # Packaged here with the bumped version already written in, so the
      # release job only has to push what this run linted.
      - run: |
          mkdir -p /tmp/chart-api
          helm package packages/api/chart --destination /tmp/chart-api
      - uses: actions/upload-artifact@v7
        with: { name: chart-api-tgz, path: /tmp/chart-api/, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-api-package
          body: '`helm package` at the bump-previewed version (artifact `chart-api-tgz`).'

  e2e-api:
    # The suite runs against the deployed artifact — this run's image, its
    # chart, a migrated PostgreSQL — rather than against imported Python.
    # Everything a unit test can reach is already covered; what is left is
    # whether the thing that gets shipped actually works.
    needs:
      - detect
      - api-grype
      - bdd-grype
      - chart-api-checkov
      - chart-bdd-checkov
    if: >-
      !failure() && !cancelled() && (
        contains(fromJson(needs.detect.outputs.changed).changed, 'api') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'lib') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'bdd') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-bdd')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # the registry fallback for unchanged components
      actions: read    # the artifact probe in load-image
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/kind-stack
        with:
          services: api
          target: api
          port: "8000"
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - name: Install the e2e group
        run: uv sync --frozen --only-group e2e
      - name: behave packages/api/features
        env:
          SHOMER_API_URL: http://localhost:8000
        run: uv run --no-sync behave packages/api/features
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: e2e-api
          body: '`behave packages/api/features` against the chart-deployed `api` on `localhost:8000`.'

  owasp-api:
    # The same deployed stack, scanned rather than driven. It gates on
    # e2e-api because a ZAP baseline against a functionally broken build
    # reports noise, expensively — and `!failure()` still lets it run when
    # e2e-api was skipped rather than failed.
    needs:
      - detect
      - api-grype
      - bdd-grype
      - chart-api-checkov
      - chart-bdd-checkov
      - e2e-api
    if: >-
      !failure() && !cancelled() && (
        contains(fromJson(needs.detect.outputs.changed).changed, 'api') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'lib') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'bdd') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api') ||
        contains(fromJson(needs.detect.outputs.changed).changed, 'chart-bdd')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: ./.github/actions/kind-stack
        with:
          services: api
          target: api
          port: "8000"
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
      # continue-on-error, with the verdict read from the report below,
      # because this step decided the job for the wrong reasons in both
      # directions: `fail_action` defaults to false, so the scan asserted
      # nothing; and its artifact upload failing reddened runs whose scan
      # was clean. Letting it end however it likes and judging the report
      # separates the two.
      - name: OWASP ZAP baseline
        id: zap
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8000
          cmd_options: "-I -a"
          allow_issue_writing: false
          artifact_name: zap-api-baseline
      - name: Read the verdict from the report
        run: |
          set -euo pipefail
          REPORT=report_json.json
          if [ ! -f "$REPORT" ]; then
            # No report means the scan never ran — a dead port-forward, a
            # container that never started. That is a failure, and it must
            # not read as a clean result.
            echo "::error::ZAP produced no $REPORT for api — the scan did not complete"
            exit 1
          fi
          # riskcode 3 = High, 2 = Medium. Keying on severity keeps the
          # threshold in this file, where it can be read, rather than in
          # ZAP's rule defaults.
          HIGH=$(jq '[.site[]?.alerts[]? | select((.riskcode|tonumber) >= 3)] | length' "$REPORT")
          MED=$(jq '[.site[]?.alerts[]? | select((.riskcode|tonumber) == 2)] | length' "$REPORT")
          echo "api: $HIGH high, $MED medium"
          jq -r '.site[]?.alerts[]? | select((.riskcode|tonumber) >= 2)
                 | "  [\(.riskdesc)] \(.name) x\(.count)"' "$REPORT"
          if [ "$HIGH" -gt 0 ]; then
            echo "::error::$HIGH high-risk ZAP alert(s) on api"
            exit 1
          fi
          if [ "${{ steps.zap.outcome }}" != "success" ]; then
            echo "::warning::the ZAP step ended as '${{ steps.zap.outcome }}' (usually the artifact upload); the scan itself produced a clean report"
          fi
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: owasp-api
          body: 'OWASP ZAP baseline against the chart-deployed `api` (report artifact `zap-api-baseline`).'

