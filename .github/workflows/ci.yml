        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-sbom
          body: 'SPDX SBOM of the `job` image (artifact `job-sbom`).'
          format: sbom
          path: /tmp/job.sbom.spdx.json

  job-grype:
    needs: [job-sbom]
    if: '!failure() && !cancelled() && needs.job-sbom.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with: { name: job-sbom, path: /tmp }
      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Scan the SBOM
        # The working directory is what makes grype pick up
        # `packages/job/.grype.yaml`, so an exception is declared beside
        # the component it applies to rather than in one global list.
        working-directory: packages/job
        run: |
          set -euo pipefail
          # The report is written from the same scan the gate then runs,
          # in this order on purpose: the gate may fail the step, and the
          # summary still needs its input.
          grype sbom:/tmp/job.sbom.spdx.json -o json > /tmp/job.grype.json
          grype sbom:/tmp/job.sbom.spdx.json --fail-on high
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: job-grype
          body: '`grype --fail-on high` on the `job` SBOM, with `packages/job/.grype.yaml` applied.'
          format: grype
          path: /tmp/job.grype.json

  chart-job-lint:
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'chart-job')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      - run: helm lint packages/job/chart
      # Render every branch, not just the default one. A template only the
      # non-default path reaches is a template nothing checks until the
      # day somebody switches CNI or turns verification on.
      - name: Render each network provider and the verification policy
        run: |
          set -euo pipefail
          for provider in kubernetes calico cilium; do
            helm template ci packages/job/chart \
              --set networkPolicy.provider="$provider" \
              > "/tmp/chart-job-$provider.yaml"
          done
          helm template ci packages/job/chart \
            --set imageVerification.enabled=true \
            > /tmp/chart-job-verify.yaml
          # An unknown provider must fail loudly rather than render an
          # empty policy and leave the pod wide open.
          if helm template ci packages/job/chart \
               --set networkPolicy.provider=bogus > /dev/null 2>&1; then
            echo "::error::an unknown networkPolicy.provider rendered without failing"
            exit 1
          fi
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-job-lint
          body: '`helm lint` + `helm template` on `packages/job/chart/`.'

  chart-job-checkov:
    needs: [chart-job-lint]
    if: '!failure() && !cancelled() && needs.chart-job-lint.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: packages/job/chart
          framework: helm
          quiet: true
          output_format: cli
          soft_fail: false
          # CKV_K8S_21: the namespace is a deploy-time flag, not a chart
          # decision. CKV_K8S_43: digest pinning is incompatible with the
          # version-tag scheme, and provenance is established by the
          # cosign signature and SBOM attestation instead.
          skip_check: CKV_K8S_21,CKV_K8S_43
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-job-checkov
          body: '`checkov --framework helm` on `packages/job/chart/`.'

  chart-job-package:
    needs: [chart-job-checkov]
    if: '!failure() && !cancelled() && needs.chart-job-checkov.result == ''success'''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: azure/setup-helm@v5
      # Packaged here with the bumped version already written in, so the
      # release job only has to push what this run linted.
      - run: |
          mkdir -p /tmp/chart-job
          helm package packages/job/chart --destination /tmp/chart-job
      - uses: actions/upload-artifact@v7
        with: { name: chart-job-tgz, path: /tmp/chart-job/, retention-days: 1 }
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: chart-job-package
          body: '`helm package` at the bump-previewed version (artifact `chart-job-tgz`).'

  # ──────────────────── docs ────────────────────

  docs-build:
    # Build the site on every docs change (PR and main). On main,
    # release-docs reuses this artifact instead of rebuilding —
    # bump-preview already wrote the next version into the working tree,
    # so the bytes are identical to what a rebuild would produce.
    needs: [detect, headers]
    if: contains(fromJson(needs.detect.outputs.changed).changed, 'docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/bump-preview
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"
      - name: Install the doc group
        run: uv sync --frozen --only-group doc
      - name: Zensical build
        run: uv run --no-sync zensical build --clean
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          retention-days: 1
      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: docs-build
          body: '`zensical build` → uploaded as `docs-site` for `release-docs` to consume.'

  # ──────────────────── release ────────────────────

  release-bump:
    # The single stage the whole graph funnels into. multicz discovers
    # which components changed since their last tag, then commits, tags
    # and pushes ALL of them in one atomic commit. Downstream publish jobs
    # read the resulting versions to decide whether to run.
    #
    # Triple gate:
    #   1. `main` only — PRs and other branches skip.
    #   2. The head commit must not itself be a release bump, or the
    #      release commit re-triggers CI and we loop.
    #   3. Every upstream check passed or was skipped. Any failure aborts.
    needs:
      - validate
      - detect
      - headers
      - audit
      - lib-bandit
      - bdd-grype
      - api-grype
      - cli-bandit
      - job-grype
      - chart-api-package
      - chart-api-verify-policy
      - chart-job-package
      - chart-bdd-package
      - chart-bdd-verify-policy
      - e2e-api
      - owasp-api
      - docs-build
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'lib') ||
       needs.lib-bandit.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'bdd') ||
       needs.bdd-grype.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'api') ||
       needs.api-grype.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'cli') ||
       needs.cli-bandit.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'job') ||
       needs.job-grype.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'chart-api') ||
       (needs.chart-api-package.result == 'success' &&
        needs.chart-api-verify-policy.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'chart-job') ||
       needs.chart-job-package.result == 'success') &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'chart-bdd') ||
       (needs.chart-bdd-package.result == 'success' &&
        needs.chart-bdd-verify-policy.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'api') ||
       (needs.e2e-api.result == 'success' &&
        needs.owasp-api.result == 'success')) &&
      (!contains(fromJson(needs.detect.outputs.changed).changed, 'docs') ||
       needs.docs-build.result == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: push-to-main
      cancel-in-progress: false
    permissions:
      contents: write   # push the release commit + tags
    outputs:
      # The whole bump map, as JSON. A release job reads its own entry
      # out of it, so adding a component is one new job rather than an
      # edit here, in the extraction step and in the job — three places,
      # where forgetting the first two ships a component that bumped,
      # tagged and was never published.
      # `|| '{}'` matters: the extraction step is skipped when nothing is
      # pending, and every downstream `if` calls fromJson on this. Left
      # empty, fromJson('') raises and turns a quiet no-release run into a
      # wall of failed publish jobs.
      bumps: ${{ steps.bump.outputs.bumps || '{}' }}
      # ghcr namespaces are lowercase; the repository owner is not
      # necessarily. Computed once here rather than in each publish job.
      owner: ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      # Pinned, like every other setup-uv in this pipeline. An unpinned one
      # does not fall back to something sane — it honours whatever
      # UV_PYTHON an earlier step left in the environment, and a composite
      # action setting 3.12 is enough to make `uv sync` refuse a workspace
      # whose floor is 3.13.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
          python-version: "3.13"

      - name: Install the workspace (ssr's post_bump runs `uv lock`)
        run: uv sync --all-packages

      # web's post_bump rebuilds the bundle during the bump, so Node has
      # to be present before multicz runs — not after.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      # It runs its own setup-uv, which re-exports UV_PYTHON as 3.12 and
      # undoes the pin above. The steps below that reach uv therefore set
      # it again at step level, which nothing later can overwrite.
      - uses: goabonga/multicz-action@v1

      - name: Configure git
        # Author name and email come from the head commit's metadata,
        # which anyone who can land a commit controls. Passing them
        # through `env:` makes them plain shell variables under quoted
        # expansion instead of text spliced into the script.
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          git config user.name  "${AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Detect GPG availability
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and unlock the GPG key
        if: steps.gpg.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo test | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback --sign > /dev/null
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          git config user.signingkey "$KEY_ID"

      - name: multicz plan
        id: plan
        env:
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          multicz plan --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/plan.json
          # multicz emits more than one JSON document here (the plan, then
          # a trailing advice object), so slurp and merge before asking
          # whether anything is pending.
          COUNT=$(jq -s '[.[] | .bumps // {}] | add | length' /tmp/plan.json)
          if [ "$COUNT" = "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "no release pending"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump, commit, tag, push (signed)
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available == 'true'
        env:
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          multicz bump --commit --tag --push --sign \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.raw
          # post_bump hooks print progress on stdout BEFORE the final JSON
          # object, so the raw output is not parseable. Strip everything
          # up to the document's opening brace, then validate — silently
          # empty versions would skip every publish job below.
          sed -n '/^{$/,$p' /tmp/release.raw > /tmp/release.json
          jq . /tmp/release.json > /dev/null

      - name: Bump, commit, tag, push
        if: steps.plan.outputs.release == 'true' && steps.gpg.outputs.available != 'true'
        env:
          UV_PYTHON: "3.13"
        run: |
          set -euo pipefail
          multicz bump --commit --tag --push \
            --summary "$GITHUB_STEP_SUMMARY" --output json | tee /tmp/release.raw
          sed -n '/^{$/,$p' /tmp/release.raw > /tmp/release.json
          jq . /tmp/release.json > /dev/null

      - name: Extract the bumped versions
        id: bump
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          # Logged so the downstream skip/run decision is auditable from
          # the run page alone.
          jq -r '.bumps | to_entries[] | "[release-bump] \(.key)=\(.value.next_version)"' \
            /tmp/release.json
          # Compact so it survives GITHUB_OUTPUT's one-line-per-value rule.
          echo "bumps=$(jq -c '.bumps // {}' /tmp/release.json)" >> "$GITHUB_OUTPUT"

      - name: Lowercase ghcr namespace
        id: owner
        run: |
          echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        uses: ./.github/actions/summary
        with:
          title: release-bump
          body: |
            `multicz bump --commit --tag --push` (signed when
            `GPG_PRIVATE_KEY` and `GPG_PASSPHRASE` are set). The
            `release-<component>` jobs read this job's outputs to know
            what to publish.

  release-lib-pypi:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['lib'].next_version != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shomer-lib/
    permissions:
      contents: write   # gh release create
      id-token: write   # Trusted Publishing (OIDC) — do NOT add a token
    steps:
      - uses: actions/checkout@v6
        with:
          # The release commit, so the wheel carries the version that was
          # just tagged rather than the one that preceded it.
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-pypi
        with:
          package: shomer-lib
          tag: lib-v${{ fromJson(needs.release-bump.outputs.bumps)['lib'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  release-bdd-image:
    # First of the three, because the other two point at what it pushes.
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['bdd'].next_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr
      id-token: write   # keyless cosign
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-image
        with:
          component: bdd
          version: ${{ fromJson(needs.release-bump.outputs.bumps)['bdd'].next_version }}
          owner: ${{ needs.release-bump.outputs.owner }}
          token: ${{ secrets.GITHUB_TOKEN }}

  release-bdd-pypi:
    # After the image: this job cuts the GitHub release, and a release
    # pointing at an image that failed to push is worse than no release.
    needs: [release-bump, release-bdd-image]
    if: |
      !failure() && !cancelled() &&
      needs.release-bdd-image.result == 'success' &&
      fromJson(needs.release-bump.outputs.bumps)['bdd'].next_version != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shomer-bdd/
    permissions:
      contents: write   # gh release create
      id-token: write   # Trusted Publishing (OIDC) — do NOT add a token
    steps:
      - uses: actions/checkout@v6
        with:
          # The release commit, so the wheel carries the version that was
          # just tagged rather than the one that preceded it.
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-pypi
        with:
          package: shomer-bdd
          tag: bdd-v${{ fromJson(needs.release-bump.outputs.bumps)['bdd'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  release-api-image:
    # First of the three, because the other two point at what it pushes.
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['api'].next_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr
      id-token: write   # keyless cosign
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-image
        with:
          component: api
          version: ${{ fromJson(needs.release-bump.outputs.bumps)['api'].next_version }}
          owner: ${{ needs.release-bump.outputs.owner }}
          token: ${{ secrets.GITHUB_TOKEN }}

  release-api-pypi:
    # After the image: this job cuts the GitHub release, and a release
    # pointing at an image that failed to push is worse than no release.
    needs: [release-bump, release-api-image]
    if: |
      !failure() && !cancelled() &&
      needs.release-api-image.result == 'success' &&
      fromJson(needs.release-bump.outputs.bumps)['api'].next_version != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shomer-api/
    permissions:
      contents: write   # gh release create
      id-token: write   # Trusted Publishing (OIDC) — do NOT add a token
    steps:
      - uses: actions/checkout@v6
        with:
          # The release commit, so the wheel carries the version that was
          # just tagged rather than the one that preceded it.
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-pypi
        with:
          package: shomer-api
          tag: api-v${{ fromJson(needs.release-bump.outputs.bumps)['api'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  release-cli-pypi:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['cli'].next_version != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shomer-cli/
    permissions:
      contents: write   # gh release create
      id-token: write   # Trusted Publishing (OIDC) — do NOT add a token
    steps:
      - uses: actions/checkout@v6
        with:
          # The release commit, so the wheel carries the version that was
          # just tagged rather than the one that preceded it.
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-pypi
        with:
          package: shomer-cli
          tag: cli-v${{ fromJson(needs.release-bump.outputs.bumps)['cli'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  release-chart-api:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['chart-api'].next_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      packages: write   # helm push to ghcr
      id-token: write   # keyless cosign
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-chart
        with:
          component: api
          owner: ${{ needs.release-bump.outputs.owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-release
        with:
          tag: chart-api-v${{ fromJson(needs.release-bump.outputs.bumps)['chart-api'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  release-chart-bdd:
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['chart-bdd'].next_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      packages: write   # helm push to ghcr
      id-token: write   # keyless cosign
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/publish-chart
        with:
          component: bdd
          owner: ${{ needs.release-bump.outputs.owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/publish-release
        with:
          tag: chart-bdd-v${{ fromJson(needs.release-bump.outputs.bumps)['chart-bdd'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  release-docs:
    # Consume the `docs-site` artifact built earlier in this run with the
    # same bump-previewed version release-bump then committed — no
    # rebuild. Deploy to Pages, then cut the docs tag's release.
    needs: [release-bump]
    if: |
      !failure() && !cancelled() &&
      fromJson(needs.release-bump.outputs.bumps)['docs'].next_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create
      pages: write      # actions/deploy-pages
      id-token: write   # OIDC for upload-pages-artifact + deploy-pages
    concurrency:
      group: pages      # one in-flight Pages deploy per repository
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      # No configure-pages step. Its `enablement` input asks the API to
      # create the Pages site, which the workflow token may not do — it
      # fails with "Resource not accessible by integration". Pages is
      # turned on once in the repository settings, with GitHub Actions as
      # the source; the two steps below need nothing more.
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - uses: ./.github/actions/publish-release
        with:
          tag: docs-v${{ fromJson(needs.release-bump.outputs.bumps)['docs'].next_version }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
